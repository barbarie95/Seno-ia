<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seno IA – Ton assistant intelligent pensé pour l'Afrique</title>
  <meta name="description" content="Seno IA répond à tes questions en français, avec des exemples adaptés au FCFA, au Mobile Money et aux réalités africaines. Crée ton compte gratuitement.">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="canonical" href="https://barbarie95.github.io/Seno-ia/">
  <link rel="icon" type="image/png" href="Logo%20Seno%20IA.png">

  <!-- Partage sur les réseaux sociaux -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:site_name" content="Seno IA">
  <meta property="og:title" content="Seno IA – Ton assistant intelligent pensé pour l'Afrique">
  <meta property="og:description" content="Pose tes questions en français et obtiens des réponses adaptées aux réalités africaines.">
  <meta property="og:url" content="https://barbarie95.github.io/Seno-ia/">
  <meta property="og:image" content="https://barbarie95.github.io/Seno-ia/Logo%20Seno%20IA.png">
  <meta property="og:image:alt" content="Logo de Seno IA : un petit robot devant la carte de l'Afrique">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Données structurées pour les moteurs de recherche -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Seno IA",
    "url": "https://barbarie95.github.io/Seno-ia/",
    "image": "https://barbarie95.github.io/Seno-ia/Logo%20Seno%20IA.png",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "Tous (navigateur web)",
    "inLanguage": "fr",
    "description": "Assistant intelligent en français pensé pour les utilisateurs africains."
  }
  </script>

  <!-- Design commun du site (couleurs, en-tête, boutons) -->
  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* Réglages propres à la page d'accueil */
    body { display: flex; flex-direction: column; }

    .accueil {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px 90px;
      text-align: center;
    }
    .contenu { width: 100%; max-width: 700px; }

    /* Logo de l'en-tête (le logo contient déjà le texte « Seno IA ») */
    .logo-img {
      height: 44px;
      width: auto;
      display: block;
      mix-blend-mode: multiply; /* fait disparaître le fond blanc de l'image */
    }

    /* Logo de l'accueil */
    .symbole {
      width: min(260px, 72%);
      margin: 0 auto 22px;
    }
    .symbole img {
      width: 100%;
      height: auto;
      display: block;
      mix-blend-mode: multiply;
    }

    h1 {
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.2;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
    }

    .bienvenue { color: var(--discret); font-size: 1.05rem; margin-bottom: 8px; }
    .sous-titre { max-width: 520px; margin: 0 auto 32px; }

    .action { display: flex; justify-content: center; }
    .action .bouton {
      min-width: 190px;
      padding: 15px 25px;
      font-size: 1rem;
      border-radius: 14px;
    }
    .bouton-principal:hover { transform: translateY(-2px); }

    /* ===== Animations ===== */
    @keyframes apparition {
      from { opacity: 0; transform: translateY(26px) scale(.97); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes flottement {
      0%, 100% { transform: translateY(0) rotate(-1.5deg); }
      50%      { transform: translateY(-14px) rotate(1.5deg); }
    }
    /* Le logo apparaît puis flotte ; le reste suit l'un après l'autre */
    .symbole    { animation: apparition .7s cubic-bezier(.2,.8,.2,1) backwards,
                             flottement 3.5s ease-in-out .7s infinite; }
    h1          { animation: apparition .7s cubic-bezier(.2,.8,.2,1) .15s backwards; }
    .bienvenue  { animation: apparition .7s cubic-bezier(.2,.8,.2,1) .3s backwards; }
    .sous-titre { animation: apparition .7s cubic-bezier(.2,.8,.2,1) .45s backwards; }
    .action     { animation: apparition .7s cubic-bezier(.2,.8,.2,1) .6s backwards; }
    /* Effet au toucher (visible sur téléphone) */
    .bouton:not(:disabled):active { transform: scale(.94); }
    /* Respect des personnes qui demandent moins d'animations */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }

    @media (max-width: 500px) {
      .accueil { padding-top: 40px; }
    }
  </style>
</head>

<body>

  <header class="entete">
    <div class="conteneur">
      <a class="logo" href="index.html" aria-label="Seno IA, accueil">
        <img class="logo-img" src="Logo%20Seno%20IA.png" alt="Seno IA">
      </a>

      <nav aria-label="Navigation principale">
        <a id="nav-connexion" class="bouton bouton-secondaire bouton-petit" href="connexion.html">Connexion</a>
        <a id="nav-inscription" class="bouton bouton-principal bouton-petit" href="connexion.html?mode=inscription">S'inscrire</a>
      </nav>
    </div>
  </header>

  <main class="accueil" id="contenu">
    <section class="contenu" aria-labelledby="titre-accueil">

      <div class="symbole">
        <img src="Logo%20Seno%20IA.png" alt="Seno IA, ton assistant intelligent">
      </div>

      <h1 id="titre-accueil">Que veux-tu faire aujourd'hui ?</h1>

      <p class="bienvenue">Bienvenue sur Seno IA</p>
      <p class="discret sous-titre">
        Pose tes questions en français et obtiens des réponses adaptées au FCFA, au Mobile Money et aux réalités africaines.
      </p>

      <div class="action">
        <a id="cta-principal" class="bouton bouton-principal" href="connexion.html?mode=inscription">Commencer</a>
      </div>

    </section>
  </main>

  <footer class="pied">
    © Seno IA
  </footer>

  <!-- Si la personne est déjà connectée, on adapte les boutons (sans bloquer l'affichage) -->
  <script defer src="https://cdn.jsdelivr.net/npm/appwrite@18.2.0"></script>
  <script defer src="assets/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (!window.JIA) return;

      JIA.utilisateur().then(function (u) {
        if (!u) return;

        var nav = document.getElementById("nav-inscription");
        nav.href = "chat.html";
        nav.textContent = "Discussion";

        document.getElementById("nav-connexion").classList.add("cache");

        var cta = document.getElementById("cta-principal");
        cta.href = "chat.html";
        cta.textContent = "Continuer la discussion";
      }).catch(function () { /* la page reste utilisable sans connexion */ });
    });
  </script>

</body>
</html>
